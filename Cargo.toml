[workspace]
resolver = "2"
members = [
    "crates/telemetry",
    "crates/enforcement",
    "crates/policy",
    "crates/smart-cache",
    "crates/intelligence",
    "crates/app",
]

[workspace.package]
version = "0.7.0-rc1"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Jose Francisco Bustamante Ocampo <josefrancisbustamante@gmail.com>"]

[workspace.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
ctrlc = "3"
libc = "0.2"
fs2 = "0.4"
model2vec-rs = { version = "=0.2.1", default-features = false, features = ["fancy-regex", "hf-hub"] }
hf-hub = { version = "=0.4.3", default-features = false, features = ["ureq"] }
windows-sys = { version = "0.61", default-features = false }

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
overflow-checks = true
